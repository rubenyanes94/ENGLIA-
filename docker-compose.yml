services:
  # --- Base de datos principal ---
  db:
    image: pgvector/pgvector:pg16
    container_name: englia_db
    restart: unless-stopped
    env_file:
      # "required: false" es lo que evita que un clon recién hecho (o un
      # Codespace nuevo) muera antes de arrancar: .env está en .gitignore,
      # así que en la primera apertura NO existe, y con la sintaxis corta
      # (`- .env`) Docker Compose aborta con "env file ... not found" —
      # en Codespaces eso hace fallar la creación del contenedor y te deja
      # en "modo recuperación". Como todos los valores tienen defaults
      # (aquí abajo y en app/core/config.py), el stack levanta sin .env.
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-englia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-englia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-englia}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Caché y memoria conversacional de corto plazo ---
  redis:
    image: redis:7-alpine
    container_name: englia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Motor de inferencia LLM (desarrollo) ---
  # En Codespaces (solo CPU) usamos Ollama para tener un modelo open source
  # real corriendo. Expone una API compatible con OpenAI en /v1, igual que
  # vLLM/NVIDIA NIM en producción: el código del agente no distingue entre
  # uno y otro, solo cambia OLLAMA_BASE_URL / LLM_BASE_URL.
  ollama:
    image: ollama/ollama:latest
    container_name: englia_ollama
    restart: unless-stopped
    environment:
      # Memoria del Codespace crítica hoy (VS Code + extensiones —
      # Pylance solo ya son ~450MB — más este propio agente, compitiendo
      # con Postgres/Redis/Celery en un host de 8GB): incluso CARGAR un
      # único modelo de 1.3GB, sin ninguna otra petición concurrente, ha
      # tumbado el proceso llama-server más de una vez ("signal:
      # terminated") solo por el pico transitorio de la carga. Minimizamos
      # lo que Ollama intenta reservar: un modelo a la vez, un slot de
      # inferencia a la vez.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      # Cuánto tiempo se queda un modelo cargado tras su último uso antes
      # de descargarse solo (default de Ollama: 5m). Lo subimos porque el
      # momento de mayor riesgo de crash es precisamente CARGAR un modelo
      # bajo presión de memoria — con esto, una vez arriba, se queda
      # arriba el resto de la sesión de desarrollo en vez de recargar
      # cada vez que pasan 5 minutos sin uso.
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # --- API en FastAPI ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: englia_backend
    restart: unless-stopped
    env_file:
      # Opcional a propósito (ver explicación en el servicio "db").
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-englia}:${POSTGRES_PASSWORD:-englia_dev_password}@db:5432/${POSTGRES_DB:-englia}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ./backend:/app
      # Volumen dedicado para /app/media, igual que /app/node_modules en
      # "frontend": este subcamino "gana" sobre el bind mount de arriba,
      # así el audio de lecciones generado persiste entre reinicios y no
      # se guarda sin querer dentro del repo en ./backend/media.
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Worker de Celery ---
  # Procesa en segundo plano lo que no debe bloquear una respuesta HTTP:
  # hoy, resumir + generar el embedding de una sesión al cerrarla. Mismo
  # código/imagen que el backend (comparten app/), pero corriendo el
  # comando de worker de Celery en vez de Uvicorn.
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: englia_celery_worker
    restart: unless-stopped
    env_file:
      # Opcional a propósito (ver explicación en el servicio "db").
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-englia}:${POSTGRES_PASSWORD:-englia_dev_password}@db:5432/${POSTGRES_DB:-englia}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # --- App en React ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: englia_frontend
    restart: unless-stopped
    # Sin variables VITE_* a propósito: el frontend llama a /api en su
    # propio origen y el proxy del servidor de Vite (ver
    # frontend/vite.config.ts) reenvía a http://backend:8000 por la red
    # interna de Docker. Antes se le pasaban CODESPACE_NAME y el dominio
    # de reenvío para construir la URL pública del puerto 8000, pero eso
    # no podía funcionar desde el navegador: los puertos de Codespaces
    # son privados por defecto y GitHub devolvía un 302 a su login (que
    # el navegador reportaba, despistando, como error de CORS).
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
  ollama_data:
  media_data:
